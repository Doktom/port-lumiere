<title>Port-Lumière</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Jeu plein écran : la scène 3D occupe tout ; l'interface flotte en panneaux "papier encré"
   (contour 2px + ombre portée dure) qui reprennent le trait du cel-shading. Un seul look, assumé. */
:root{
  --ink:#2a2238; --paper:#fff4d8; --paper-2:#f4e2b5; --leaf:#5fae4a; --sun:#f3b336; --sea:#2f8fc0; --berry:#d9486b; --night:#1d2347;
  --f-display:'Gluten','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gl:max(16px, env(safe-area-inset-left,0px)); --gr:max(16px, env(safe-area-inset-right,0px));
  --gt:max(16px, env(safe-area-inset-top,0px)); --gb:max(16px, env(safe-area-inset-bottom,0px));
  --slot:min(54px, calc((100vw - 72px) / 10));
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
button{font:inherit;color:inherit}
.btn{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1;border:2px solid var(--ink);border-radius:10px;background:var(--paper-2);box-shadow:2px 2px 0 var(--ink);padding:9px 14px 7px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#fff}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--sun)}
.btn.sm{font-size:14px;padding:7px 10px 5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible,.slot:focus-visible,.chip:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
kbd{font-family:var(--f-body);font-weight:700;font-size:.85em;border:1.5px solid var(--ink);border-bottom-width:3px;border-radius:5px;padding:0 5px;background:#fff}

#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#clock{position:absolute;top:var(--gt);right:var(--gr);padding:8px 14px 10px;min-width:128px;display:grid;gap:2px;text-align:right}
.cl-top{font-family:var(--f-display);font-weight:700;font-size:19px;display:flex;justify-content:flex-end;gap:6px;align-items:baseline}
#cl-season{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;font-weight:700}
.cl-time{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;display:flex;justify-content:flex-end;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
#cl-sun{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--sun);transition:background .6s}
.cl-gold{margin-top:4px;padding-top:6px;border-top:2px dashed rgba(42,34,56,.25);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.coin{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18);flex:none}
#energy{position:absolute;right:var(--gr);bottom:var(--gb);width:28px;height:150px;padding:4px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}
#en-fill{width:100%;border-radius:6px;background:var(--leaf);border:2px solid var(--ink);box-sizing:border-box;transition:height .25s,background .25s;min-height:4px}
#energy b{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:16px;color:var(--paper);text-shadow:2px 2px 0 var(--ink)}
#hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--gb);display:flex;gap:4px;padding:5px;pointer-events:auto}
.slot{width:var(--slot);height:var(--slot);border-radius:8px;background:var(--paper-2);border:2px solid transparent;position:relative;display:grid;place-items:center;cursor:pointer;padding:0}
.slot.sel{border-color:var(--ink);background:#fff;box-shadow:inset 0 -4px 0 var(--sun)}
.slot img{width:80%;height:80%;pointer-events:none}
.slot .q{position:absolute;right:3px;bottom:0;font-weight:700;font-size:12px;text-shadow:-1px -1px 0 #fff,1px 1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff;font-variant-numeric:tabular-nums}
.slot .k{position:absolute;left:4px;top:1px;font-size:10px;font-weight:700;opacity:.45}
.slot .gauge{position:absolute;left:7px;right:7px;bottom:4px;height:4px;background:rgba(42,34,56,.18);border-radius:2px;overflow:hidden}
.slot .gauge i{display:block;height:100%;background:var(--sea)}
#itemname{position:absolute;left:50%;bottom:calc(var(--gb) + var(--slot) + 22px);transform:translateX(-50%);font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);white-space:nowrap;transition:opacity .3s;opacity:0}
#prompt{position:absolute;left:50%;bottom:calc(var(--gb) + var(--slot) + 52px);transform:translateX(-50%);padding:6px 12px 5px;font-weight:700;font-size:15px;white-space:nowrap;display:none}
#prompt.on{display:block}
#toasts{position:absolute;left:var(--gl);top:calc(var(--gt) + 50px);display:grid;gap:6px;justify-items:start;max-width:min(360px, calc(100vw - 200px))}
.toast{padding:7px 12px 6px;font-size:14px;font-weight:700;animation:tin .25s ease-out}
.toast.out{opacity:0;transform:translateX(-10px);transition:all .35s}
@keyframes tin{from{opacity:0;transform:translateX(-12px)}}
#help-btn{position:absolute;left:var(--gl);top:var(--gt);pointer-events:auto}
.chip{width:38px;height:38px;border-radius:50%;font-family:var(--f-display);font-weight:800;font-size:19px;cursor:pointer;display:grid;place-items:center;padding:0}
#zone{position:absolute;left:50%;top:calc(var(--gt) + 6px);transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4vw,34px);color:var(--paper);text-shadow:3px 3px 0 var(--ink);opacity:0;transition:opacity .6s;white-space:nowrap}
#zone.on{opacity:1}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.bubble{position:absolute;transform:translate(-50%,-100%);padding:7px 11px 6px;font-size:14px;font-weight:700;max-width:220px;text-align:center;line-height:1.3}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble .who{display:block;font-family:var(--f-display);font-size:13px;color:var(--berry)}
.bubble.bang{font-family:var(--f-display);font-size:30px;padding:0 12px;color:var(--berry);animation:pop .3s}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.4)}}
.floater{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);animation:rise 1.2s ease-out forwards;white-space:nowrap;display:flex;align-items:center;gap:4px}
.floater img{width:28px;height:28px}
@keyframes rise{to{transform:translate(-50%,-190%);opacity:0}}

#fishing{position:fixed;z-index:4;left:calc(50% + 70px);top:50%;transform:translateY(-50%);padding:10px 10px 8px;display:grid;justify-items:center;gap:4px}
#fishing p{margin:0;font-size:12px;font-weight:700;text-align:center}
#fish-c{width:110px;height:330px;display:block}

#modal-wrap{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(29,35,71,.42);padding-left:var(--gl);padding-right:var(--gr)}
#modal{width:min(540px, 100%);max-height:calc(100% - 64px);overflow:auto;padding:18px 20px 16px;box-sizing:border-box}
#modal h2{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
#modal .who{margin:6px 0 0;font-size:15px;line-height:1.45;max-width:60ch}
#modal .who b{color:var(--berry)}
.tabs{display:flex;gap:6px;margin:14px 0 10px}
.tab{font-family:var(--f-display);font-weight:700;font-size:16px;border:2px solid var(--ink);border-radius:9px 9px 0 0;padding:7px 14px 5px;background:var(--paper-2);cursor:pointer;border-bottom-width:2px}
.tab[aria-selected="true"]{background:#fff;box-shadow:inset 0 -4px 0 var(--sun)}
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;background:rgba(244,226,181,.55)}
.row img{width:40px;height:40px}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:15px}
.row .nm small{display:block;font-size:12.5px;opacity:.72;line-height:1.3}
.row .price{font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;white-space:nowrap}
.row .acts{display:flex;gap:5px}
.empty{padding:18px 8px;text-align:center;opacity:.7;font-size:14px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.mfoot .money{font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:14px 0 4px;font-size:14.5px;align-items:center}
.keys dt{white-space:nowrap}
.keys dd{margin:0}
.daylines{margin:12px 0 4px;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.daylines li{display:flex;gap:8px;align-items:center}

#touch{position:fixed;inset:auto 0 calc(var(--gb) + var(--slot) + 34px) 0;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;padding-left:var(--gl);padding-right:calc(var(--gr) + 40px);pointer-events:none}
#joy{width:120px;height:120px;border-radius:50%;background:rgba(255,244,216,.35);border:2px solid rgba(42,34,56,.6);position:relative;pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.tbtns{display:grid;grid-template-columns:auto auto;gap:10px;pointer-events:auto}
.tbtn{width:64px;height:64px;border-radius:50%;font-family:var(--f-display);font-weight:800;font-size:15px;touch-action:none}

#fade{position:fixed;inset:0;z-index:8;background:#12142a;opacity:0;pointer-events:none;transition:opacity .65s}
#fade.on{opacity:1}
#title{position:fixed;inset:0;z-index:7;display:grid;align-content:end;justify-items:center;padding:0 var(--gr) calc(var(--gb) + 6vh) var(--gl);background:linear-gradient(180deg,rgba(29,35,71,0) 35%,rgba(29,35,71,.62));text-align:center}
#title .eyebrow{margin:0;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper);text-shadow:1px 1px 0 var(--ink)}
#title h1{margin:4px 0 18px;font-family:var(--f-display);font-weight:800;font-size:clamp(54px,12vw,124px);line-height:.95;color:var(--paper);text-shadow:4px 5px 0 var(--ink);-webkit-text-stroke:2px var(--ink);letter-spacing:-.01em}
#title h1 span{color:var(--sun)}
.title-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.title-actions .btn{font-size:19px;padding:12px 20px 10px}
#title .hint{margin:16px 0 0;font-size:14px;color:var(--paper);text-shadow:1px 1px 0 var(--ink);max-width:56ch;line-height:1.5}
#title .hint kbd{color:var(--ink);text-shadow:none}

@media (max-width:640px){
  #energy{bottom:calc(var(--gb) + var(--slot) + 30px);height:110px}
  #clock{min-width:0;padding:6px 10px 8px}
  .cl-time{font-size:24px}
  #fishing{left:auto;right:var(--gr)}
  #fish-c{width:90px;height:270px}
  .row{grid-template-columns:34px minmax(0,1fr) auto;}
  .row img{width:34px;height:34px}
  .row .acts{grid-column:2 / -1;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){ .toast,.bubble.bang,.floater{animation:none} }
</style>

<canvas id="c" tabindex="0" aria-label="Port-Lumière, scène de jeu"></canvas>

<div id="hud" hidden>
  <button id="help-btn" class="chip panel" aria-label="Commandes">?</button>
  <div id="toasts" aria-live="polite"></div>
  <div id="zone"></div>
  <div id="clock" class="panel">
    <div class="cl-top"><span id="cl-wd">Lun.</span><span id="cl-d">1</span></div>
    <div id="cl-season">Printemps</div>
    <div class="cl-time"><span id="cl-sun"></span><span id="cl-t">6h00</span></div>
    <div class="cl-gold"><span class="coin"></span><span id="cl-g">0</span></div>
  </div>
  <div id="energy" class="panel" title="Énergie"><b>É</b><div id="en-fill"></div></div>
  <div id="itemname"></div>
  <div id="prompt" class="panel"></div>
  <div id="hotbar" class="panel" role="toolbar" aria-label="Inventaire"></div>
</div>
<div id="bubbles"></div>
<div id="fishing" class="panel" hidden><canvas id="fish-c"></canvas><p>Maintiens <kbd>Espace</kbd></p></div>
<div id="modal-wrap" hidden><div id="modal" class="panel" role="dialog" aria-modal="true"></div></div>
<div id="touch" hidden>
  <div id="joy"><i></i></div>
  <div class="tbtns">
    <button class="tbtn btn" id="t-eat">Manger</button>
    <button class="tbtn btn primary" id="t-use">Outil</button>
    <span></span>
    <button class="tbtn btn" id="t-act">Action</button>
  </div>
</div>
<div id="fade"></div>
<div id="title">
  <p class="eyebrow">Une petite ferme au bord de la mer</p>
  <h1>Port-<span>Lumière</span></h1>
  <div class="title-actions">
    <button id="btn-continue" class="btn" hidden>Continuer</button>
    <button id="btn-new" class="btn primary">Nouvelle partie</button>
  </div>
  <p class="hint"><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> ou flèches pour marcher · <kbd>Espace</kbd> ou clic pour utiliser l'outil · <kbd>E</kbd> pour parler, acheter, dormir</p>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wait = ms => new Promise(r => setTimeout(r, ms));
function hash2(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
let seedV = 20261026;
const rnd = () => ((seedV = (seedV * 16807) % 2147483647) - 1) / 2147483646;

try { await Promise.race([document.fonts.load('700 48px "Gluten"'), wait(1500)]); } catch (e) {}

// =====================================================================
// Données de jeu
// =====================================================================
const ITEMS = {
  hoe:        { name: 'Houe', kind: 'tool', hint: "Laboure l'herbe de ta ferme" },
  can:        { name: 'Arrosoir', kind: 'tool', hint: "Arrose les cultures, se remplit à l'eau" },
  rod:        { name: 'Canne en bambou', kind: 'tool', hint: "Vise l'eau pour lancer la ligne" },
  rod2:       { name: 'Canne en fibre', kind: 'tool', buy: 600, hint: 'Zone de prise 40 % plus grande' },
  s_radis:    { name: 'Graines de radis', kind: 'seed', crop: 'radis', buy: 15 },
  s_carotte:  { name: 'Graines de carotte', kind: 'seed', crop: 'carotte', buy: 25 },

  radis:      { name: 'Radis', kind: 'crop', sell: 35, food: 12 },
  carotte:    { name: 'Carotte', kind: 'crop', sell: 60, food: 20 },
  tomate:     { name: 'Tomate', kind: 'crop', sell: 45, food: 15 },
  citrouille: { name: 'Citrouille', kind: 'crop', sell: 320, food: 45 },
  gardon:     { name: 'Gardon', kind: 'fish', sell: 25, diff: 18, color: '#a9bfae', cm: [12, 25] },
  truite:     { name: 'Truite', kind: 'fish', sell: 65, diff: 42, color: '#d797a8', cm: [22, 45] },
  brochet:    { name: 'Brochet', kind: 'fish', sell: 140, diff: 68, color: '#86a65c', cm: [45, 90] },
  anguille:   { name: 'Anguille', kind: 'fish', sell: 110, diff: 60, color: '#6b6a8c', cm: [40, 80] },
  sardine:    { name: 'Sardine', kind: 'fish', sell: 20, diff: 14, color: '#b3cde0', cm: [10, 20] },
  maquereau:  { name: 'Maquereau', kind: 'fish', sell: 60, diff: 40, color: '#4f93b8', cm: [25, 45] },
  bar:        { name: 'Bar', kind: 'fish', sell: 110, diff: 58, color: '#c2c9d1', cm: [35, 70] },
  thon:       { name: 'Thon', kind: 'fish', sell: 280, diff: 84, color: '#37548a', cm: [80, 160] },
};
const CROPS = {
  radis:      { days: 3, item: 'radis', col: '#e0457b' },
  carotte:    { days: 5, item: 'carotte', col: '#f08a2a' },
  tomate:     { days: 7, item: 'tomate', regrow: 3, col: '#e8402e' },
  citrouille: { days: 10, item: 'citrouille', col: '#f0902a' },
};
const FISH_TABLE = {
  river: [['gardon', 50], ['truite', 30], ['brochet', 10], ['anguille', 12, 'night']],
  sea:   [['sardine', 45], ['maquereau', 30], ['bar', 15], ['thon', 7, 'pier']],
};
const SHOPS = {
  graines: { name: 'Graines & Co', keeper: 'Rose', open: 540, close: 1020, buys: ['crop'],
    hello: "Bienvenue ! Les radis poussent en trois jours, c'est parfait pour démarrer. N'oublie pas d'arroser chaque matin.",
    stock: ['s_radis', 's_carotte', 's_tomate', 's_citrouille'] },
  poisson: { name: 'Poissonnerie du Port', keeper: 'Marius', open: 480, close: 1020, buys: ['fish'],
    hello: "Le thon ne mord qu'au bout de la jetée. Et l'anguille sort à la nuit tombée, dans la rivière.",
    stock: ['rod2'] },
};
const WEEK = ['Lun.', 'Mar.', 'Mer.', 'Jeu.', 'Ven.', 'Sam.', 'Dim.'];
const SEASONS = ['Printemps', 'Été', 'Automne', 'Hiver'];
const CAN_MAX = 40, MAX_EN = 100, MIN_SEC = 0.6; // 1 minute de jeu = 0,6 s

// =====================================================================
// Icônes dessinées (canvas) : aplats + contour encré
// =====================================================================
const iconCache = {};
function icon(id) {
  if (iconCache[id]) return iconCache[id];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const INK = '#2a2238';
  x.lineJoin = 'round'; x.lineCap = 'round'; x.lineWidth = 3.5; x.strokeStyle = INK;
  const fs = f => { x.fillStyle = f; x.fill(); x.stroke(); };
  const stick = (x1, y1, x2, y2, w, col) => {
    x.save(); x.strokeStyle = INK; x.lineWidth = w + 5; x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke();
    x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke(); x.restore();
  };
  const ell = (cx, cy, rx, ry, col, rot = 0) => { x.beginPath(); x.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); fs(col); };
  const shine = (cx, cy, r) => { x.save(); x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.ellipse(cx, cy, r, r * 0.6, -0.6, 0, Math.PI * 2); x.fill(); x.restore(); };
  const leaves = (cx, cy, col = '#5fae4a') => { ell(cx - 7, cy, 5, 10, col, -0.5); ell(cx + 7, cy, 5, 10, col, 0.5); ell(cx, cy - 4, 5, 10, '#6fc152'); };
  const it = ITEMS[id];
  if (id === 'hoe') {
    stick(16, 54, 44, 16, 5, '#b07a48');
    x.beginPath(); x.moveTo(36, 9); x.lineTo(56, 13); x.lineTo(52, 27); x.lineTo(41, 19); x.closePath(); fs('#aeb8c6');
  } else if (id === 'can') {
    stick(42, 36, 57, 22, 5, '#6aa6c8');
    x.beginPath(); x.arc(28, 26, 11, Math.PI, 0); x.save(); x.lineWidth = 8; x.stroke(); x.strokeStyle = '#5a8fb0'; x.lineWidth = 3.5; x.stroke(); x.restore();
    x.beginPath(); x.roundRect(12, 24, 32, 28, 7); fs('#6aa6c8'); shine(20, 32, 5);

function prismGeo(w, h, d) {
  const A = [-w / 2, 0, d / 2], B = [w / 2, 0, d / 2], C = [-w / 2, 0, -d / 2], D = [w / 2, 0, -d / 2], E = [-w / 2, h, 0], F = [w / 2, h, 0];
  const tris = [A, B, F, A, F, E, D, C, E, D, E, F, C, A, E, B, D, F, A, C, D, A, D, B];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat(), 3));
  geo.computeVertexNormals(); return geo;
}
const fades = [];
function fadeable(g, x0, z0, x1, z1) {
  const mats = new Map();
  g.traverse(o => {
    if (!o.isMesh || o.material === winMat || o.material === lampMat || o.material === fireMat) return;
    let m = mats.get(o.material);

  fades.push({ x0, z0, x1, z1, mats: [...mats.values()], a: 1 });
}

  if (!spend(3)) return;
  const k = id(tgt[0], tgt[1]);
  S.fish = { phase: 'cast', t: 0, to: new THREE.Vector3(tgt[0] + 0.5, -0.24, tgt[1] + 0.5), from: new THREE.Vector3(), type: tiles[k] === RIVER ? 'river' : 'sea', pier: tgt[1] >= 55 };

}

  if (msg) toast(msg);
}

  let tot = 0; for (const e of list) tot += e[1] * (f.pier && e[1] < 20 ? 1.6 : 1);
  let r = rnd() * tot;

  mg = { fid, d: def.diff, TR, barH, barY: TR - barH, barV: 0, fy: TR * 0.7, ft: TR * 0.5, ftT: 0, prog: 0.3 };

}
function updateMinigame(dt) {

  m.barY += m.barV * dt;

  if (m.barY > m.TR - m.barH) { m.barY = m.TR - m.barH; m.barV *= -0.3; }

  m.fy = clamp(m.fy, 8, m.TR - 8);

  m.prog += (inside ? 0.27 : -0.2 * (0.6 + m.d / 110)) * dt;
  if (m.prog >= 1) {
    const def = ITEMS[m.fid], cm = Math.round(lerp(def.cm[0], def.cm[1], rnd()));
    if (addItem(m.fid, 1)) { sfx('catch'); floater(`${def.name} · ${cm} cm`, m.fid); toast(`Tu as pêché : ${def.name} (${cm} cm) !`); }
    else toast('Inventaire plein, le poisson retourne à l\'eau.');

  }
  if (m.prog <= 0) { sfx('lose'); endFishing("Il s'est échappé…"); return; }
  // dessin

  if (fishC.width !== Math.round(cw * dpr)) { fishC.width = Math.round(cw * dpr); fishC.height = Math.round(ch * dpr); }
  const sc = (ch - 20) / m.TR;

  const tw = cw * 0.52, tx = 6, ty = 10, th = m.TR * sc;
  x.lineWidth = 2.5; x.strokeStyle = '#2a2238';
  x.fillStyle = '#4aa0c8'; x.beginPath(); x.roundRect(tx, ty, tw, th, 10); x.fill();
  x.fillStyle = '#2f7fae'; x.beginPath(); x.roundRect(tx, ty + th * 0.72, tw, th * 0.28, [0, 0, 10, 10]); x.fill();
  x.beginPath(); x.roundRect(tx, ty, tw, th, 10); x.stroke();
  x.fillStyle = inside ? 'rgba(135,230,95,.85)' : 'rgba(135,230,95,.55)';
  x.beginPath(); x.roundRect(tx + 3, ty + m.barY * sc, tw - 6, m.barH * sc, 7); x.fill(); x.stroke();

function updateFishing(dt) {

  } else if (f.phase === 'wait') {

  } else if (f.phase === 'bite') {

  S.fade = true; $('#fade').classList.add('on'); await wait(750);
  let grown = 0, earned = 0;
  for (const [k, p] of plots) { if (p.crop && p.watered && p.crop.age < CROPS[p.crop.type].days) { p.crop.age++; grown++; } p.watered = false; refreshPlot(k); }
  const shipped = S.ship.slice(); for (const [it, q] of S.ship) earned += ITEMS[it].sell * q; S.ship = []; S.gold += earned;
  let lost = 0; if (passedOut) { lost = Math.min(500, Math.floor(S.gold * 0.1)); S.gold -= lost; }
